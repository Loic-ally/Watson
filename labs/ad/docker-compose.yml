# Watson AD lab — single Samba Active Directory domain controller.
# First `up` provisions CORP.LAB.LOCAL and seeds it (see seed.sh); data persists in
# the named volumes until `docker compose down -v`.
services:
  dc:
    build: .
    container_name: watson-ad-dc
    hostname: dc01
    privileged: true          # Samba AD DC wants broad capabilities; fine for a throwaway lab
    networks:
      lab:
        ipv4_address: 10.13.37.10
    # No host port publishing: Windows already owns 445, and Watson reaches the DC through a
    # Linux tools container on this same `lab` network (its EXEGOL_CONTAINER), not from the host.
    # On Linux you may add a `ports:` block to expose the DC to the host if you prefer.
    volumes:
      - ad-data:/var/lib/samba
      - ad-etc:/etc/samba

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.37.0/24

volumes:
  ad-data:
  ad-etc:
