[package]
name = "aether-provisioner"
version = "0.5.0"
edition = "2021"
publish = false

# Confined provisioning service (Stages 10-11). Runs under its own service
# account in a private mount (and, where supported, PID) namespace, listening on
# an abstract unix socket. Stage 10 is discovery + handshake; Stage 11 is a
# controlled namespace-privilege design mistake.

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[[bin]]
name = "aether-provisioner"
path = "src/main.rs"
