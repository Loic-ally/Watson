[package]
name = "aether-indexer"
version = "0.8.3"
edition = "2021"
publish = false

# Legacy native record indexer. Predates the agent's JSON envelope; retained as a
# compatibility service for "legacy-envelope/0" binary records. Stage 09 target.

[dependencies]
hmac = "=0.12.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"

[[bin]]
name = "aether-indexer"
path = "src/main.rs"
