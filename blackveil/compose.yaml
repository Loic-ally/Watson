name: blackveil

services:
  aether-gateway:
    image: nginx:1.29-alpine
    depends_on:
      aether-web:
        condition: service_started
      aether-api:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro
    networks: [edge, app]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-auth:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      AETHER_MODE: auth
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://aether_auth:${AETHER_AUTH_DB_PASSWORD}@aether-db:5432/${AETHER_POSTGRES_DB:-aether}?sslmode=disable
      NATS_URL: nats://aether-bus:4222
      REDIS_URL: redis://aether-cache:6379/0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://aether.blackveil.test}
    depends_on:
      aether-migrate:
        condition: service_completed_successfully
      aether-db:
        condition: service_healthy
      aether-bus:
        condition: service_started
      aether-cache:
        condition: service_healthy
    networks: [app, data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      AETHER_MODE: migrate
      DATABASE_URL: postgres://${AETHER_POSTGRES_USER:-aether}:${AETHER_DB_PASSWORD}@aether-db:5432/${AETHER_POSTGRES_DB:-aether}?sslmode=disable
      AETHER_API_DB_PASSWORD: ${AETHER_API_DB_PASSWORD}
      AETHER_AUTH_DB_PASSWORD: ${AETHER_AUTH_DB_PASSWORD}
      AETHER_WORKER_DB_PASSWORD: ${AETHER_WORKER_DB_PASSWORD}
      AETHER_LEGACY_DB_PASSWORD: ${AETHER_LEGACY_DB_PASSWORD}
      AETHER_TELEMETRY_DB_PASSWORD: ${AETHER_TELEMETRY_DB_PASSWORD}
    depends_on:
      aether-db:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  aether-legacy:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      AETHER_MODE: legacy
      AETHER_LEGACY_SERVICE_KEY: ${AETHER_LEGACY_SERVICE_KEY}
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://aether_legacy:${AETHER_LEGACY_DB_PASSWORD}@aether-db:5432/${AETHER_POSTGRES_DB:-aether}?sslmode=disable
      NATS_URL: nats://aether-bus:4222
      REDIS_URL: redis://aether-cache:6379/0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://aether.blackveil.test}
    depends_on:
      aether-migrate:
        condition: service_completed_successfully
      aether-db:
        condition: service_healthy
      aether-bus:
        condition: service_started
      aether-cache:
        condition: service_healthy
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      AETHER_MODE: api
      AETHER_IDENTITY_MODE: ${AETHER_IDENTITY_MODE:-challenge}
      AETHER_AUTH_URL: http://aether-auth:8080
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://aether_api:${AETHER_API_DB_PASSWORD}@aether-db:5432/${AETHER_POSTGRES_DB:-aether}?sslmode=disable
      NATS_URL: nats://aether-bus:4222
      REDIS_URL: redis://aether-cache:6379/0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://aether.blackveil.test}
      AETHER_VM_SSH_ADDRESS: aether-linux-vm:2222
      AETHER_VM_SSH_KEY_PATH: /var/lib/aether-vm/operator_ed25519
      AETHER_VM_SSH_HOST_KEY_PATH: /var/lib/aether-vm/guest_host_ed25519.pub
    depends_on:
      aether-migrate:
        condition: service_completed_successfully
      aether-auth:
        condition: service_healthy
      aether-db:
        condition: service_healthy
      aether-bus:
        condition: service_started
      aether-cache:
        condition: service_healthy
    networks: [app, data, lab]
    group_add: ["10001"]
    volumes:
      - linux-vm-state:/var/lib/aether-vm:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      AETHER_MODE: worker
      AETHER_LEGACY_URL: http://aether-legacy:8080
      DATABASE_URL: postgres://aether_worker:${AETHER_WORKER_DB_PASSWORD}@aether-db:5432/${AETHER_POSTGRES_DB:-aether}?sslmode=disable
      NATS_URL: nats://aether-bus:4222
      REDIS_URL: redis://aether-cache:6379/0
      AETHER_AGENT_MODE: ${AETHER_AGENT_MODE:-challenge}
      AETHER_AGENT_URL: ${AETHER_AGENT_URL:-http://aether-linux-vm:18080}
      AETHER_AGENT_KEY: ${AETHER_AGENT_KEY}
      AETHER_LEGACY_SERVICE_KEY: ${AETHER_LEGACY_SERVICE_KEY}
    depends_on:
      aether-legacy:
        condition: service_healthy
      aether-api:
        condition: service_healthy
    networks: [data, lab]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-telemetry:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      AETHER_MODE: telemetry
      DATABASE_URL: postgres://aether_telemetry:${AETHER_TELEMETRY_DB_PASSWORD}@aether-db:5432/${AETHER_POSTGRES_DB:-aether}?sslmode=disable
      NATS_URL: nats://aether-bus:4222
      REDIS_URL: redis://aether-cache:6379/0
    depends_on:
      aether-api:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-linux-vm:
    profiles: [vm]
    build:
      context: ./vm
      dockerfile: Dockerfile
    environment:
      AETHER_AGENT_KEY: ${AETHER_AGENT_KEY}
      AETHER_AGENT_MODE: ${AETHER_AGENT_MODE:-challenge}
    volumes:
      - linux-vm-state:/var/lib/aether-vm
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/vm-ready && curl --fail --silent http://127.0.0.1:18080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-linux-vm-patched:
    profiles: [vm-verify]
    build:
      context: ./vm
      dockerfile: Dockerfile
    environment:
      AETHER_AGENT_KEY: ${AETHER_AGENT_KEY}
      AETHER_AGENT_MODE: patched
    volumes:
      - linux-vm-patched-state:/var/lib/aether-vm
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/vm-ready && curl --fail --silent http://127.0.0.1:18080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${AETHER_POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${AETHER_DB_PASSWORD}
      POSTGRES_DB: ${AETHER_POSTGRES_DB:-aether}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  aether-bus:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    networks: [data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  edge:
    name: blackveil_edge
    driver: bridge
  app:
    name: blackveil_app_internal
    driver: bridge
    internal: true
  data:
    name: blackveil_data_internal
    driver: bridge
    internal: true
  lab:
    name: blackveil_lab_internal
    driver: bridge
    internal: true

volumes:
  postgres-data:
  nats-data:
  linux-vm-state:
    name: blackveil_linux_vm_state
  linux-vm-patched-state:
    name: blackveil_linux_vm_patched_state
