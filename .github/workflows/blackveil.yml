name: BLACK VEIL

on:
  push:
    paths: ["blackveil/**", ".github/workflows/blackveil.yml"]
  pull_request:
    paths: ["blackveil/**", ".github/workflows/blackveil.yml"]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blackveil/web/package-lock.json
      - name: Unit checks
        working-directory: blackveil/api
        run: go test ./...
      - name: Build web app
        working-directory: blackveil/web
        run: npm ci && npm run build
      - name: Start isolated services
        working-directory: blackveil
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-local-only-password/ci-local-only-password-0123456789/' .env
          ./scripts/setup-local.sh
          docker compose --env-file .env -f compose.yaml up --build -d --wait
      - name: Verify business workflows and network boundaries
        working-directory: blackveil
        run: |
          python3 scripts/smoke.py
          python3 scripts/verify-team.py
          python3 scripts/verify-legacy.py
          python3 scripts/verify-recovery.py
          python3 scripts/verify-db-roles.py
          ./scripts/check-network.sh
      - name: Verify application chain Stages 01-05 (web scope, no guest)
        working-directory: blackveil
        run: python3 scripts/verify-chain.py --web
      - name: Verify persistent restart and competing report workers
        working-directory: blackveil
        run: python3 scripts/verify-lifecycle.py --restart-app
      - name: Verify full chain Stages 01-08 and Linux VM boundary
        working-directory: blackveil
        run: |
          docker compose --env-file .env -f compose.yaml --profile vm --profile vm-verify up -d --build --wait --wait-timeout 600 aether-linux-vm aether-linux-vm-patched
          python3 scripts/verify-worker.py
          python3 scripts/verify-chain.py
          python3 scripts/vm-verify.py
      - name: Tear down test environment
        if: always()
        working-directory: blackveil
        run: docker compose --env-file .env -f compose.yaml down --volumes --remove-orphans
