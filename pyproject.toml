[project]
name = "watson"
version = "0.0.1"
description = "Autonomous AI pentest agent for your own site, powered by Meta Muse models + a CVE RAG."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "lancedb>=0.13",
    "fastembed>=0.4",
    "ddgs>=6.0",
    "flask>=3.0",
    "pysocks>=1.7",
    "cvss>=3.0",
]

[project.scripts]
watson = "watson.cli:main"

[tool.setuptools]
packages = ["watson"]

[tool.setuptools.package-data]
watson = ["data/*.json", "data/**/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
